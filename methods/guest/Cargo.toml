[package]
name = "method"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "=2.3.2", default-features = false, features = [ "std" ] }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
base64ct = "1.6.0"
num-bigint = "0.4.4"

[patch.crates-io]
# RISC Zero SHA-256 accelerator (required for guest builds on 2.3).
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }